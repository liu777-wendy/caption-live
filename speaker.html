<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>字幕發送</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f6f2;
      --card: #ffffff;
      --border: #e5e3dc;
      --text: #1a1a1a;
      --sub: #888;
      --accent: #1a6ef5;
      --accent-light: #e8f0fe;
      --danger: #e53935;
      --success: #00a86b;
      --radius: 16px;
    }

    html, body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans TC', sans-serif;
    }

    /* ── SCREENS ── */
    .screen { display: none; min-height: 100vh; flex-direction: column; }
    .screen.active { display: flex; }

    /* ── SCREEN 1: Group Select ── */
    #screen-group {
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      gap: 2rem;
    }

    .logo {
      text-align: center;
    }
    .logo h1 {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: -0.02em;
    }
    .logo p {
      font-size: 0.9rem;
      color: var(--sub);
      margin-top: 0.3rem;
    }

    .group-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.8rem;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .group-card label {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--sub);
      text-transform: uppercase;
    }

    .group-input-row {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .group-input-row button {
      width: 44px; height: 44px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      font-size: 1.4rem;
      cursor: pointer;
      color: var(--text);
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .group-input-row button:hover { background: var(--border); }

    #group-num {
      flex: 1;
      text-align: center;
      font-size: 2.5rem;
      font-weight: 900;
      color: var(--accent);
      border: 2px solid var(--accent-light);
      border-radius: 10px;
      padding: 0.3rem;
      background: var(--accent-light);
    }

    .mode-btns {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }

    .mode-btn {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.2rem;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: var(--card);
      cursor: pointer;
      text-align: left;
      transition: border-color 0.2s, background 0.2s;
      width: 100%;
    }
    .mode-btn:hover {
      border-color: var(--accent);
      background: var(--accent-light);
    }

    .mode-icon {
      font-size: 2rem;
      flex-shrink: 0;
    }
    .mode-info strong {
      display: block;
      font-size: 1rem;
      font-weight: 700;
    }
    .mode-info span {
      font-size: 0.8rem;
      color: var(--sub);
    }

    /* ── SCREEN 2: Voice Mode ── */
    #screen-voice {
      padding: 1.5rem;
      gap: 1rem;
      align-items: stretch;
    }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .back-btn {
      width: 36px; height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      cursor: pointer;
      font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
      color: var(--text);
      flex-shrink: 0;
    }
    .screen-title {
      font-size: 1rem;
      font-weight: 700;
      flex: 1;
    }
    .group-label {
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 700;
      background: var(--accent-light);
      padding: 0.2rem 0.7rem;
      border-radius: 20px;
    }

    /* QR section */
    .qr-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    #qr-container-voice {
      width: 80px; height: 80px;
      flex-shrink: 0;
    }
    #qr-container-voice canvas, #qr-container-voice img { width: 80px !important; height: 80px !important; }
    .qr-info strong {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
    }
    .qr-info span {
      font-size: 0.75rem;
      color: var(--sub);
      word-break: break-all;
    }
    .qr-expand-btn {
      margin-top: 0.4rem;
      font-size: 0.75rem;
      color: var(--accent);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      font-family: 'Noto Sans TC', sans-serif;
    }

    /* Transcript */
    #transcript-box {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      font-size: 1rem;
      line-height: 1.6;
      color: var(--text);
      min-height: 100px;
      position: relative;
    }
    #transcript-text {
      white-space: pre-wrap;
      word-break: break-word;
    }
    #interim-text {
      color: var(--sub);
      font-style: italic;
    }
    .placeholder {
      color: var(--sub);
      font-size: 0.9rem;
    }

    /* Mic button */
    #mic-btn {
      width: 100%;
      padding: 1.2rem;
      border-radius: 16px;
      border: none;
      font-size: 1.2rem;
      font-weight: 700;
      font-family: 'Noto Sans TC', sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      transition: background 0.2s, transform 0.1s;
      background: var(--accent);
      color: white;
    }
    #mic-btn.listening {
      background: var(--danger);
      animation: pulse 1.5s ease infinite;
    }
    #mic-btn:active { transform: scale(0.98); }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(229,57,53,0.4); }
      50% { box-shadow: 0 0 0 12px rgba(229,57,53,0); }
    }

    .clear-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.6rem 1rem;
      font-size: 0.85rem;
      color: var(--sub);
      cursor: pointer;
      font-family: 'Noto Sans TC', sans-serif;
      transition: border-color 0.2s;
    }
    .clear-btn:hover { border-color: var(--danger); color: var(--danger); }

    /* ── SCREEN 3: Type Mode ── */
    #screen-type {
      padding: 1.5rem;
      gap: 1rem;
      align-items: stretch;
    }

    #type-textarea {
      flex: 1;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      font-size: 1.1rem;
      font-family: 'Noto Sans TC', sans-serif;
      line-height: 1.7;
      resize: none;
      color: var(--text);
      min-height: 120px;
      outline: none;
      transition: border-color 0.2s;
    }
    #type-textarea:focus { border-color: var(--accent); }
    #type-textarea::placeholder { color: var(--sub); }

    .collab-info {
      background: var(--accent-light);
      border-radius: 10px;
      padding: 0.7rem 1rem;
      font-size: 0.8rem;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    #send-btn {
      width: 100%;
      padding: 1.1rem;
      border-radius: 14px;
      border: none;
      background: var(--accent);
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      font-family: 'Noto Sans TC', sans-serif;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    #send-btn:active { transform: scale(0.98); }
    #send-btn:hover { background: #1558d6; }

    #send-status {
      text-align: center;
      font-size: 0.8rem;
      color: var(--success);
      min-height: 1.2rem;
    }

    /* ── QR Modal ── */
    #qr-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    #qr-modal.open { display: flex; }
    .qr-modal-inner {
      background: white;
      border-radius: 20px;
      padding: 2rem;
      text-align: center;
      max-width: 320px;
      width: 100%;
    }
    .qr-modal-inner h3 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }
    #qr-modal-container { margin: 0 auto 1rem; width: 200px; height: 200px; }
    #qr-modal-container canvas, #qr-modal-container img { width: 200px !important; height: 200px !important; }
    .qr-modal-url {
      font-size: 0.75rem;
      color: var(--sub);
      word-break: break-all;
      margin-bottom: 1rem;
    }
    .qr-close-btn {
      background: var(--text);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0.7rem 2rem;
      font-size: 0.9rem;
      font-family: 'Noto Sans TC', sans-serif;
      cursor: pointer;
    }
  </style>
</head>
<body>

<!-- SCREEN 1: Group Select -->
<div id="screen-group" class="screen active">
  <div class="logo">
    <h1>字幕發送</h1>
    <p>選擇組別，開始導覽</p>
  </div>

  <div class="group-card">
    <label>選擇組別</label>
    <div class="group-input-row">
      <button id="group-minus">－</button>
      <div id="group-num">1</div>
      <button id="group-plus">＋</button>
    </div>

    <label>選擇模式</label>
    <div class="mode-btns">
      <button class="mode-btn" id="btn-voice-mode">
        <div class="mode-icon">🎤</div>
        <div class="mode-info">
          <strong>語音模式</strong>
          <span>說話自動轉成字幕，適合戶外導覽</span>
        </div>
      </button>
      <button class="mode-btn" id="btn-type-mode">
        <div class="mode-icon">⌨️</div>
        <div class="mode-info">
          <strong>聽打模式</strong>
          <span>手動輸入文字，適合正式場合</span>
        </div>
      </button>
    </div>
  </div>
</div>

<!-- SCREEN 2: Voice Mode -->
<div id="screen-voice" class="screen">
  <div class="top-bar">
    <button class="back-btn" id="voice-back">←</button>
    <span class="screen-title">🎤 語音模式</span>
    <span class="group-label" id="voice-group-label">第 1 組</span>
  </div>

  <div class="qr-section">
    <div id="qr-container-voice"></div>
    <div class="qr-info">
      <strong>學員掃描看字幕</strong>
      <span id="qr-url-voice"></span>
      <button class="qr-expand-btn" id="qr-expand-voice">放大 QR Code ▸</button>
    </div>
  </div>

  <div id="transcript-box">
    <div id="transcript-text"></div>
    <div id="interim-text"></div>
    <div class="placeholder" id="voice-placeholder">按下方按鈕開始說話…</div>
  </div>

  <button class="clear-btn" id="clear-btn">清除內容</button>

  <button id="mic-btn">
    <span id="mic-icon">🎤</span>
    <span id="mic-label">開始說話</span>
  </button>
</div>

<!-- SCREEN 3: Type Mode -->
<div id="screen-type" class="screen">
  <div class="top-bar">
    <button class="back-btn" id="type-back">←</button>
    <span class="screen-title">⌨️ 聽打模式</span>
    <span class="group-label" id="type-group-label">第 1 組</span>
  </div>

  <div class="qr-section">
    <div id="qr-container-type"></div>
    <div class="qr-info">
      <strong>學員掃描看字幕</strong>
      <span id="qr-url-type"></span>
      <button class="qr-expand-btn" id="qr-expand-type">放大 QR Code ▸</button>
    </div>
  </div>

  <div class="collab-info">
    💡 兩人協作：主聽打員輸入，校對員可同時編輯後送出
  </div>

  <textarea id="type-textarea" placeholder="在這裡輸入文字…&#10;&#10;按「送出字幕」後學員才會看到"></textarea>

  <div id="send-status"></div>

  <button id="send-btn">送出字幕</button>
</div>

<!-- QR Modal -->
<div id="qr-modal">
  <div class="qr-modal-inner">
    <h3 id="qr-modal-title">學員掃描此 QR Code</h3>
    <div id="qr-modal-container"></div>
    <div class="qr-modal-url" id="qr-modal-url"></div>
    <button class="qr-close-btn" id="qr-close">關閉</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const FIREBASE_URL = "https://caption-live-f7131-default-rtdb.asia-southeast1.firebasedatabase.app";
  const CAPTION_BASE_URL = "https://liu777-wendy.github.io/caption-live/caption-live.html";

  const app = initializeApp({ databaseURL: FIREBASE_URL });
  const db = getDatabase(app);

  let currentGroup = 1;

  // ── Group select ──
  const groupNum = document.getElementById("group-num");
  document.getElementById("group-minus").addEventListener("click", () => {
    if (currentGroup > 1) { currentGroup--; groupNum.textContent = currentGroup; }
  });
  document.getElementById("group-plus").addEventListener("click", () => {
    currentGroup++;
    groupNum.textContent = currentGroup;
  });

  function getStudentURL(group) {
    return `${CAPTION_BASE_URL}?group=${group}`;
  }

  function makeQR(containerId, url) {
    const el = document.getElementById(containerId);
    el.innerHTML = "";
    new QRCode(el, { text: url, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M });
  }

  function showScreen(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
  }

  // ── Voice Mode ──
  document.getElementById("btn-voice-mode").addEventListener("click", () => {
    const url = getStudentURL(currentGroup);
    document.getElementById("voice-group-label").textContent = `第 ${currentGroup} 組`;
    document.getElementById("qr-url-voice").textContent = url;
    makeQR("qr-container-voice", url);
    showScreen("screen-voice");
  });

  document.getElementById("voice-back").addEventListener("click", () => {
    stopListening();
    showScreen("screen-group");
  });

  // ── Type Mode ──
  document.getElementById("btn-type-mode").addEventListener("click", () => {
    const url = getStudentURL(currentGroup);
    document.getElementById("type-group-label").textContent = `第 ${currentGroup} 組`;
    document.getElementById("qr-url-type").textContent = url;
    makeQR("qr-container-type", url);
    showScreen("screen-type");
  });

  document.getElementById("type-back").addEventListener("click", () => {
    showScreen("screen-group");
  });

  // ── QR Expand ──
  function openQRModal(group) {
    const url = getStudentURL(group);
    document.getElementById("qr-modal-title").textContent = `第 ${group} 組 — 學員掃描`;
    document.getElementById("qr-modal-url").textContent = url;
    makeQR("qr-modal-container", url);
    document.getElementById("qr-modal").classList.add("open");
  }

  document.getElementById("qr-expand-voice").addEventListener("click", () => openQRModal(currentGroup));
  document.getElementById("qr-expand-type").addEventListener("click", () => openQRModal(currentGroup));
  document.getElementById("qr-close").addEventListener("click", () => {
    document.getElementById("qr-modal").classList.remove("open");
  });
  document.getElementById("qr-modal").addEventListener("click", e => {
    if (e.target === document.getElementById("qr-modal"))
      document.getElementById("qr-modal").classList.remove("open");
  });

  // ── Firebase send ──
  async function sendCaption(text) {
    const r = ref(db, `captions/group${currentGroup}`);
    await set(r, { text, ts: Date.now() });
  }

  // ── Voice Mode Logic ──
  const micBtn = document.getElementById("mic-btn");
  const micIcon = document.getElementById("mic-icon");
  const micLabel = document.getElementById("mic-label");
  const transcriptText = document.getElementById("transcript-text");
  const interimText = document.getElementById("interim-text");
  const voicePlaceholder = document.getElementById("voice-placeholder");

  let recognition = null;
  let isListening = false;
  let fullTranscript = "";

  function stopListening() {
    if (recognition) recognition.stop();
    isListening = false;
    micBtn.classList.remove("listening");
    micIcon.textContent = "🎤";
    micLabel.textContent = "開始說話";
  }

  micBtn.addEventListener("click", () => {
    if (isListening) { stopListening(); return; }

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert("您的瀏覽器不支援語音辨識，請使用 Chrome 瀏覽器"); return; }

    recognition = new SR();
    recognition.lang = "zh-TW";
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onstart = () => {
      isListening = true;
      micBtn.classList.add("listening");
      micIcon.textContent = "⏹";
      micLabel.textContent = "停止說話";
      voicePlaceholder.style.display = "none";
    };

    recognition.onresult = (e) => {
      let interim = "";
      let final = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) final += t;
        else interim += t;
      }
      if (final) {
        fullTranscript += final;
        transcriptText.textContent = fullTranscript;
        sendCaption(final.trim());
      }
      interimText.textContent = interim;
    };

    recognition.onerror = (e) => {
      if (e.error !== "aborted") console.error(e.error);
    };

    recognition.onend = () => {
      if (isListening) recognition.start(); // auto-restart
    };

    recognition.start();
  });

  document.getElementById("clear-btn").addEventListener("click", () => {
    fullTranscript = "";
    transcriptText.textContent = "";
    interimText.textContent = "";
    voicePlaceholder.style.display = "";
    sendCaption("");
  });

  // ── Type Mode Logic ──
  const sendBtn = document.getElementById("send-btn");
  const typeTextarea = document.getElementById("type-textarea");
  const sendStatus = document.getElementById("send-status");

  sendBtn.addEventListener("click", async () => {
    const text = typeTextarea.value.trim();
    if (!text) return;
    await sendCaption(text);
    sendStatus.textContent = "✓ 已送出";
    setTimeout(() => sendStatus.textContent = "", 2000);
    typeTextarea.value = "";
    typeTextarea.focus();
  });

  // Send on Enter (not Shift+Enter)
  typeTextarea.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendBtn.click();
    }
  });
</script>
</body>
</html>
