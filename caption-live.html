<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>即時字幕</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --text: #f0f0f0;
      --old-text: #888;
      --panel-bg: #161616;
      --panel-border: #2a2a2a;
      --accent: #00e5ff;
      --font-size: 3.5rem;
    }

    body.light {
      --bg: #f5f5f0;
      --text: #111;
      --old-text: #999;
      --panel-bg: #fff;
      --panel-border: #ddd;
      --accent: #0077cc;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans TC', sans-serif;
      overflow: hidden;
      transition: background 0.3s, color 0.3s;
    }

    #stage {
      width: 100vw; height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 2rem 3rem 4rem;
    }

    #caption-box {
      width: 100%;
      max-width: 1400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .caption-line {
      font-size: var(--font-size);
      font-weight: 700;
      line-height: 1.35;
      text-align: center;
      letter-spacing: 0.02em;
      word-break: break-word;
      padding: 0 1rem;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeUp 0.3s ease forwards;
      transition: color 0.3s;
    }

    .caption-line.old {
      color: var(--old-text);
      font-size: calc(var(--font-size) * 0.65);
      font-weight: 400;
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Top bar */
    #topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.7rem 1rem;
      z-index: 20;
    }

    #group-badge {
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--accent);
      opacity: 0.7;
    }

    #status-bar {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      color: var(--old-text);
    }

    #dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--old-text);
      transition: background 0.4s;
    }
    #dot.live { background: #00e57a; box-shadow: 0 0 8px #00e57a; }

    /* Settings button */
    #settings-btn {
      position: fixed;
      bottom: 1.2rem;
      right: 1.2rem;
      width: 44px; height: 44px;
      border-radius: 50%;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      cursor: pointer;
      color: var(--old-text);
      font-size: 1.2rem;
      display: flex; align-items: center; justify-content: center;
      transition: color 0.2s, border-color 0.2s;
      z-index: 20;
    }
    #settings-btn:hover { color: var(--accent); border-color: var(--accent); }

    /* Settings panel */
    #settings-panel {
      position: fixed;
      bottom: 4rem;
      right: 1.2rem;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 1.4rem;
      display: none;
      flex-direction: column;
      gap: 1.2rem;
      min-width: 240px;
      z-index: 20;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    #settings-panel.open { display: flex; }

    .setting-row {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .setting-row label {
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      color: var(--old-text);
    }

    /* Font size buttons */
    .size-btns {
      display: flex;
      gap: 0.5rem;
    }
    .size-btn {
      flex: 1;
      padding: 0.5rem;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
      background: none;
      color: var(--text);
      cursor: pointer;
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 0.85rem;
      transition: background 0.2s, border-color 0.2s;
    }
    .size-btn:hover, .size-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
    }

    /* Theme toggle */
    .theme-btns {
      display: flex;
      gap: 0.5rem;
    }
    .theme-btn {
      flex: 1;
      padding: 0.5rem;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
      background: none;
      color: var(--text);
      cursor: pointer;
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 0.85rem;
      transition: background 0.2s, border-color 0.2s;
    }
    .theme-btn:hover, .theme-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
    }

    /* Prev line toggle */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .toggle {
      position: relative;
      width: 44px; height: 24px;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      background: var(--panel-border);
      border-radius: 24px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .slider::before {
      content: '';
      position: absolute;
      width: 18px; height: 18px;
      left: 3px; top: 3px;
      background: white;
      border-radius: 50%;
      transition: transform 0.3s;
    }
    .toggle input:checked + .slider { background: var(--accent); }
    .toggle input:checked + .slider::before { transform: translateX(20px); }
  </style>
</head>
<body>

<div id="topbar">
  <div id="group-badge"></div>
  <div id="status-bar">
    <div id="dot"></div>
    <span id="status-text">連線中…</span>
  </div>
</div>

<button id="settings-btn">⚙</button>

<div id="settings-panel">
  <div class="setting-row">
    <label>字幕大小</label>
    <div class="size-btns">
      <button class="size-btn" data-size="2.2">小</button>
      <button class="size-btn active" data-size="3.5">中</button>
      <button class="size-btn" data-size="5">大</button>
      <button class="size-btn" data-size="7">特大</button>
    </div>
  </div>
  <div class="setting-row">
    <label>背景主題</label>
    <div class="theme-btns">
      <button class="theme-btn active" data-theme="dark">🌙 深色</button>
      <button class="theme-btn" data-theme="light">☀️ 淺色</button>
    </div>
  </div>
  <div class="setting-row">
    <div class="toggle-row">
      <label>顯示前一句</label>
      <label class="toggle">
        <input type="checkbox" id="show-prev" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>
</div>

<div id="stage">
  <div id="caption-box"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const FIREBASE_URL = "https://caption-live-f7131-default-rtdb.asia-southeast1.firebasedatabase.app";

  // Get group from URL param
  const params = new URLSearchParams(location.search);
  const group = params.get("group") || "1";
  document.getElementById("group-badge").textContent = `第 ${group} 組`;

  const app = initializeApp({ databaseURL: FIREBASE_URL });
  const db = getDatabase(app);
  const captionRef = ref(db, `captions/group${group}`);

  const dot = document.getElementById("dot");
  const statusText = document.getElementById("status-text");
  const box = document.getElementById("caption-box");

  let prevText = "";
  let currentText = "";
  let showPrev = true;

  function render(newText) {
    if (newText === currentText) return;
    prevText = currentText;
    currentText = newText;
    box.innerHTML = "";
    if (showPrev && prevText) {
      const oldLine = document.createElement("div");
      oldLine.className = "caption-line old";
      oldLine.textContent = prevText;
      box.appendChild(oldLine);
    }
    if (currentText) {
      const newLine = document.createElement("div");
      newLine.className = "caption-line";
      newLine.textContent = currentText;
      box.appendChild(newLine);
    }
  }

  onValue(captionRef, (snapshot) => {
    dot.classList.add("live");
    statusText.textContent = "LIVE";
    const val = snapshot.val();
    const text = val && typeof val === "object" ? (val.text || "") : (val || "");
    render(String(text));
  }, () => {
    dot.classList.remove("live");
    statusText.textContent = "連線失敗";
  });

  // Settings
  const settingsBtn = document.getElementById("settings-btn");
  const settingsPanel = document.getElementById("settings-panel");
  settingsBtn.addEventListener("click", e => { e.stopPropagation(); settingsPanel.classList.toggle("open"); });
  document.addEventListener("click", () => settingsPanel.classList.remove("open"));
  settingsPanel.addEventListener("click", e => e.stopPropagation());

  document.querySelectorAll(".size-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".size-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      document.documentElement.style.setProperty("--font-size", btn.dataset.size + "rem");
    });
  });

  document.querySelectorAll(".theme-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".theme-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      document.body.classList.toggle("light", btn.dataset.theme === "light");
    });
  });

  document.getElementById("show-prev").addEventListener("change", e => {
    showPrev = e.target.checked;
    render(currentText);
  });
</script>
</body>
</html>
