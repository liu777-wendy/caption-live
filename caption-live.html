<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>即時字幕</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Bebas+Neue&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --text: #f0f0f0;
      --accent: #00e5ff;
      --dim: #444;
      --font-size: 3.5rem;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans TC', sans-serif;
      overflow: hidden;
    }

    #stage {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 2rem 3rem 3.5rem;
    }

    #caption-box {
      width: 100%;
      max-width: 1400px;
      min-height: 5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
    }

    .caption-line {
      font-size: var(--font-size);
      font-weight: 700;
      line-height: 1.3;
      text-align: center;
      text-shadow:
        0 0 30px rgba(0, 229, 255, 0.25),
        2px 2px 0px rgba(0,0,0,0.8);
      letter-spacing: 0.02em;
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.35s ease forwards;
      word-break: break-word;
      padding: 0 0.5rem;
    }

    .caption-line.old {
      color: #888;
      font-size: calc(var(--font-size) * 0.72);
      font-weight: 400;
      text-shadow: none;
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Status bar */
    #status-bar {
      position: fixed;
      top: 1rem;
      right: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.95rem;
      letter-spacing: 0.12em;
      color: var(--dim);
      user-select: none;
    }

    #dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--dim);
      transition: background 0.4s;
    }
    #dot.live { background: #00e57a; box-shadow: 0 0 8px #00e57a; }

    /* Settings panel */
    #settings-btn {
      position: fixed;
      top: 1rem;
      left: 1.2rem;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--dim);
      font-size: 1.3rem;
      transition: color 0.2s;
      padding: 0.3rem;
    }
    #settings-btn:hover { color: var(--accent); }

    #settings-panel {
      position: fixed;
      top: 3rem;
      left: 1.2rem;
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 1.2rem 1.4rem;
      display: none;
      flex-direction: column;
      gap: 1rem;
      min-width: 220px;
      z-index: 10;
    }
    #settings-panel.open { display: flex; }

    .setting-row {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .setting-row label {
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      color: #666;
      text-transform: uppercase;
    }
    .setting-row input[type=range] {
      accent-color: var(--accent);
      width: 100%;
    }
    .setting-row select,
    .setting-row input[type=color] {
      background: #222;
      border: 1px solid #333;
      color: var(--text);
      border-radius: 5px;
      padding: 0.3rem 0.5rem;
      font-size: 0.85rem;
      width: 100%;
    }

    /* Scrolling background grid (subtle) */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div id="status-bar">
  <div id="dot"></div>
  <span id="status-text">連線中…</span>
</div>

<button id="settings-btn" title="設定">⚙</button>

<div id="settings-panel">
  <div class="setting-row">
    <label>字體大小</label>
    <input type="range" id="font-size-range" min="1" max="8" step="0.1" value="3.5">
  </div>
  <div class="setting-row">
    <label>文字顏色</label>
    <input type="color" id="text-color" value="#f0f0f0">
  </div>
  <div class="setting-row">
    <label>背景顏色</label>
    <input type="color" id="bg-color" value="#0a0a0a">
  </div>
  <div class="setting-row">
    <label>顯示前一行</label>
    <select id="show-prev">
      <option value="1">是</option>
      <option value="0">否</option>
    </select>
  </div>
  <div class="setting-row">
    <label>背景透明度</label>
    <input type="range" id="bg-alpha" min="0" max="1" step="0.05" value="1">
  </div>
</div>

<div id="stage">
  <div id="caption-box"></div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const FIREBASE_URL = "https://caption-live-f7131-default-rtdb.asia-southeast1.firebasedatabase.app";

  const app = initializeApp({ databaseURL: FIREBASE_URL });
  const db = getDatabase(app);

  const captionRef = ref(db, "caption");
  const dot = document.getElementById("dot");
  const statusText = document.getElementById("status-text");
  const box = document.getElementById("caption-box");

  let prevText = "";
  let currentText = "";
  let showPrev = true;

  function render(newText) {
    if (newText === currentText) return;
    prevText = currentText;
    currentText = newText;

    box.innerHTML = "";

    if (showPrev && prevText) {
      const oldLine = document.createElement("div");
      oldLine.className = "caption-line old";
      oldLine.textContent = prevText;
      box.appendChild(oldLine);
    }

    if (currentText) {
      const newLine = document.createElement("div");
      newLine.className = "caption-line";
      newLine.textContent = currentText;
      box.appendChild(newLine);
    }
  }

  onValue(captionRef, (snapshot) => {
    dot.classList.add("live");
    statusText.textContent = "LIVE";
    const val = snapshot.val();
    const text = (val && typeof val === "object") ? (val.text || "") : (val || "");
    render(String(text));
  }, (err) => {
    dot.classList.remove("live");
    statusText.textContent = "連線失敗";
    console.error(err);
  });

  // Settings
  const settingsBtn = document.getElementById("settings-btn");
  const settingsPanel = document.getElementById("settings-panel");
  settingsBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    settingsPanel.classList.toggle("open");
  });
  document.addEventListener("click", () => settingsPanel.classList.remove("open"));
  settingsPanel.addEventListener("click", e => e.stopPropagation());

  document.getElementById("font-size-range").addEventListener("input", (e) => {
    document.documentElement.style.setProperty("--font-size", e.target.value + "rem");
  });

  document.getElementById("text-color").addEventListener("input", (e) => {
    document.documentElement.style.setProperty("--text", e.target.value);
  });

  const bgColorInput = document.getElementById("bg-color");
  const bgAlphaInput = document.getElementById("bg-alpha");

  function applyBg() {
    const hex = bgColorInput.value;
    const alpha = bgAlphaInput.value;
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    document.body.style.background = `rgba(${r},${g},${b},${alpha})`;
  }
  bgColorInput.addEventListener("input", applyBg);
  bgAlphaInput.addEventListener("input", applyBg);

  document.getElementById("show-prev").addEventListener("change", (e) => {
    showPrev = e.target.value === "1";
    render(currentText);
  });
</script>
</body>
</html>
